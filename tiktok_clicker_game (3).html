<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTok Followers Clicker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        tiktok: {
                            cyan: '#00f2fe',
                            pink: '#fe0979',
                            dark: '#1a1a1a',
                            light: '#f0f2f5'
                        }
                    },
                    boxShadow: {
                        'soft': '0 10px 40px -10px rgba(0,0,0,0.08)',
                        'glow-cyan': '0 0 20px rgba(0, 242, 254, 0.3)',
                        'glow-pink': '0 0 20px rgba(254, 9, 121, 0.3)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f0f2f5;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 242, 254, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(254, 9, 121, 0.05), transparent 25%);
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Enhanced 3D Logo Effect */
        #logo-wrapper {
            perspective: 1200px;
            transform-style: preserve-3d;
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }

        #logo-container {
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
        }

        #logo-image {
            width: 100%;
            max-width: 320px;
            border-radius: 16px;
            /* Enhanced Chromatic Aberration via multiple shadows */
            filter: 
                drop-shadow(6px 0px 0px rgba(0, 242, 254, 0.6)) 
                drop-shadow(-6px 0px 0px rgba(254, 9, 121, 0.6))
                drop-shadow(0 20px 30px rgba(0,0,0,0.15));
            transform: translateZ(30px); /* Push out from container */
            transition: filter 0.3s ease;
        }

        /* Glassmorphism utilities */
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
        }

        /* Input Styling */
        .custom-input-group {
            position: relative;
            transition: all 0.3s ease;
            background: white;
            border-radius: 99px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 2px solid transparent;
        }
        
        .custom-input-group:focus-within {
            border-color: rgba(0, 242, 254, 0.5);
            box-shadow: 0 0 0 4px rgba(0, 242, 254, 0.1);
        }

        /* Main Clicker Button */
        .clicker-btn {
            background: white;
            position: relative;
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
            box-shadow: 
                0 10px 25px rgba(0,0,0,0.05),
                inset 0 0 0 2px rgba(240,240,240,1);
        }

        .clicker-btn::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: inherit;
            background: linear-gradient(45deg, #00f2fe, #fe0979);
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
            filter: blur(10px);
        }

        .clicker-btn:hover::before {
            opacity: 0.3;
        }

        .clicker-btn:active {
            transform: scale(0.94);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        /* Screen Transitions */
        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform: scale(0.95);
            z-index: 10;
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        /* Number Animation Update for Smooth Scaling */
        #followers-count {
            transition: color 0.2s ease, text-shadow 0.2s ease;
            transform-origin: center;
            will-change: transform, color, text-shadow;
            display: inline-block;
        }

        #followers-count.combo-active {
            color: #fe0979;
            text-shadow: 0 4px 25px rgba(254, 9, 121, 0.5);
        }

        @keyframes counterBounce {
            0% { transform: scale(1); }
            40% { transform: scale(1.45); }
            75% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }

        .animate-pop {
            animation: counterBounce 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #particles-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 50;
        }
        
        /* Layout constraint */
        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            margin: 0 auto;
        }
    </style>
</head>
<body class="antialiased font-sans">

    <canvas id="particles-canvas"></canvas>

    <div class="app-container">
        <!-- LOGIN SCREEN -->
        <div id="login-screen" class="screen active p-6 w-full">
            
            <div id="logo-wrapper">
                <div id="logo-container">
                    <img id="logo-image" 
                         src="https://i.ibb.co/9H5Mqxhs/Gemini-Generated-Image-bhv3zgbhv3zgbhv3-Photoroom-1.png" 
                         alt="TikTok Clicker Logo">
                </div>
            </div>

            <div class="w-full space-y-6 max-w-sm mx-auto">
                <div class="text-center">
                    <h1 class="text-2xl font-bold text-gray-800">Ready to go viral?</h1>
                    <p class="text-gray-500 mt-1 text-sm">Enter your username to start</p>
                </div>

                <div class="custom-input-group flex items-center p-1 pl-4 pr-1">
                    <i class="fa-solid fa-at text-gray-400"></i>
                    <input type="text" id="username-input" placeholder="username" 
                           class="flex-1 bg-transparent border-none outline-none py-3 px-3 text-gray-800 font-medium placeholder-gray-400 w-full cursor-default"
                           autocomplete="off" readonly tabindex="-1">
                    <button id="paste-btn" class="px-4 py-2.5 text-sm font-semibold text-gray-700 bg-gray-100 hover:bg-gray-200 transition-colors rounded-full flex items-center gap-2" title="Paste">
                        <i class="fa-solid fa-paste text-tiktok-cyan"></i>
                    </button>
                </div>

                <button id="start-btn" class="w-full py-3.5 rounded-full bg-gray-900 hover:bg-black text-white font-semibold text-base shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all duration-200">
                    Start Clicking
                </button>
            </div>
        </div>

        <!-- GAME SCREEN -->
        <div id="game-screen" class="screen p-4 w-full h-full flex flex-col pt-12 pb-8">
            
            <div class="bg-white rounded-[24px] p-6 w-full max-w-sm mx-auto mb-auto shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-gray-50 flex flex-col items-center relative overflow-hidden">
                
                <!-- Avatar -->
                <div class="relative mb-3">
                    <div class="w-24 h-24 rounded-full bg-[#e1e1e1] flex items-center justify-center overflow-hidden">
                        <img src="https://i.pinimg.com/236x/bb/23/50/bb2350109863ae3c230542f13fc3a002.jpg?nii=t" alt="Profile Picture" class="w-full h-full object-cover">
                    </div>
                    <button class="absolute bottom-0 right-0 w-7 h-7 bg-[#20D5EC] rounded-full border-[2.5px] border-white flex items-center justify-center text-white font-medium text-lg leading-none z-10 hover:bg-[#1bbad0] transition-colors">
                        <span class="mb-[2px]">+</span>
                    </button>
                </div>

                <!-- Username & Handle -->
                <div class="flex items-center justify-center gap-1.5 mb-1 relative w-full">
                    <h2 id="display-name" class="text-[1.15rem] font-bold text-gray-900 leading-tight tracking-tight text-center">creator</h2>
                    <i class="fa-solid fa-chevron-down text-gray-900 text-[10px] mt-0.5"></i>
                    <!-- Added Edit button next to name -->
                    <button class="absolute right-0 bg-gray-100 px-3 py-1.5 rounded-md text-[13px] font-semibold text-gray-700 hover:bg-gray-200 transition-colors">Edit</button>
                </div>
                <div id="display-username" class="text-[13px] text-gray-500 mb-6 font-medium text-center">@creator</div>

                <!-- Stats -->
                <div class="flex justify-between items-center w-full px-2 mb-2">
                    <div class="text-center w-20">
                        <div class="text-[17px] font-bold text-gray-900 mb-0.5">0</div>
                        <div class="text-[13px] text-gray-500 font-medium">Following</div>
                    </div>
                    <div class="w-px h-6 bg-gray-200 mx-1"></div>
                    <div class="text-center flex-1 mx-2">
                        <!-- Emphasized Followers Count -->
                        <div id="followers-count" class="text-3xl font-black text-gray-900 mb-0.5 transition-colors duration-200 tracking-tight">0</div>
                        <div class="text-[13px] text-gray-800 font-bold">Followers</div>
                    </div>
                    <div class="w-px h-6 bg-gray-200 mx-1"></div>
                    <div class="text-center w-20">
                        <div class="text-[17px] font-bold text-gray-900 mb-0.5">0</div>
                        <div class="text-[13px] text-gray-500 font-medium">Likes</div>
                    </div>
                </div>
            </div>

            <div class="flex-1 flex flex-col items-center justify-center w-full my-8 relative z-10">
                <button id="main-clicker" class="clicker-btn w-64 h-64 rounded-full flex items-center justify-center group focus:outline-none focus:ring-4 focus:ring-tiktok-pink/30">
                    <svg viewBox="0 0 448 512" class="w-24 h-24 text-gray-900" fill="currentColor">
                        <path d="M448,209.91a210.06,210.06,0,0,1-122.77-39.25V349.38A162.55,162.55,0,1,1,185,188.31V278.2a74.62,74.62,0,1,0,52.23,71.18V0l88,0a121.18,121.18,0,0,0,1.86,22.17h0A122.18,122.18,0,0,0,381,102.39a121.43,121.43,0,0,0,67,20.14Z"/>
                    </svg>
                </button>
            </div>
            
            <div id="spacer" class="h-10"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginScreen = document.getElementById('login-screen');
            const gameScreen = document.getElementById('game-screen');
            const usernameInput = document.getElementById('username-input');
            const pasteBtn = document.getElementById('paste-btn');
            const startBtn = document.getElementById('start-btn');
            const displayUsername = document.getElementById('display-username');
            const mainClicker = document.getElementById('main-clicker');
            const followersCountEl = document.getElementById('followers-count');
            const logoContainer = document.getElementById('logo-container');
            const logoImage = document.getElementById('logo-image');
            const canvas = document.getElementById('particles-canvas');
            const ctx = canvas.getContext('2d');
            const displayName = document.getElementById('display-name');

            let followers = 0;
            let particles = [];
            let username = "";
            let clickCount = 0;
            let clickPower = 1;
            let width, height;
            let counterTimeout;

            // --- Enhanced 3D Logo Logic ---
            let targetRotX = 0, targetRotY = 0;
            let currentRotX = 0, currentRotY = 0;
            const maxRotation = 15; // Max tilt angle
            let isHovering = false;

            function updateLogoFromMouse(e) {
                if(!loginScreen.classList.contains('active')) return;
                
                isHovering = true;
                const rect = logoContainer.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                
                // Calculate position relative to center (-1 to 1)
                const percentX = (e.clientX - centerX) / (window.innerWidth / 2);
                const percentY = (e.clientY - centerY) / (window.innerHeight / 2);

                // Opposite rotation for a natural "following" feel
                targetRotY = percentX * maxRotation;
                targetRotX = -percentY * maxRotation;
            }

            function handleDeviceOrientation(e) {
                if(!loginScreen.classList.contains('active') || isHovering || e.beta === null) return;
                
                // e.beta represents front-to-back tilt (-180 to 180). Held normally, it's ~30 to 60.
                // e.gamma represents left-to-right tilt (-90 to 90).
                
                // Base the center on a typical holding angle of 45 degrees
                let tiltX = e.beta - 45; 
                let tiltY = e.gamma;

                // Increase sensitivity
                tiltX *= 1.2;
                tiltY *= 1.2;

                // Clamp to max rotation
                tiltX = Math.max(-maxRotation, Math.min(maxRotation, tiltX));
                tiltY = Math.max(-maxRotation, Math.min(maxRotation, tiltY));

                targetRotX = -tiltX;
                targetRotY = tiltY;
            }

            function resetLogo() {
                isHovering = false;
                targetRotX = 0;
                targetRotY = 0;
            }

            function animateLogo() {
                // Lerp for smooth easing
                currentRotX += (targetRotX - currentRotX) * 0.1;
                currentRotY += (targetRotY - currentRotY) * 0.1;

                // Apply rotation
                logoContainer.style.transform = `rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;
                
                // Dynamic chromatic aberration based on tilt magnitude
                const tiltMag = Math.sqrt(currentRotX*currentRotX + currentRotY*currentRotY);
                const maxMag = Math.sqrt(maxRotation*maxRotation + maxRotation*maxRotation);
                const intensity = (tiltMag / maxMag) * 10; // Max spread

                // Calculate direction for shadow offset
                let sOffsetX = currentRotY * 0.5;
                let sOffsetY = -currentRotX * 0.5;

                logoImage.style.filter = `
                    drop-shadow(${5 + intensity + sOffsetX}px ${sOffsetY}px 0px rgba(0, 242, 254, 0.6)) 
                    drop-shadow(${-5 - intensity + sOffsetX}px ${sOffsetY}px 0px rgba(254, 9, 121, 0.6))
                    drop-shadow(0 20px 30px rgba(0,0,0,0.15))
                `;

                requestAnimationFrame(animateLogo);
            }
            animateLogo();

            document.addEventListener('mousemove', updateLogoFromMouse);
            document.addEventListener('mouseleave', resetLogo);
            
            // Request permission for device orientation on user interaction (iOS 13+ requirement)
            let orientationRequested = false;
            function initDeviceOrientation() {
                if (orientationRequested) return;
                
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                        .then(response => {
                            if (response == 'granted') {
                                window.addEventListener('deviceorientation', handleDeviceOrientation);
                            }
                        })
                        .catch(console.error);
                } else {
                    window.addEventListener('deviceorientation', handleDeviceOrientation);
                }
                orientationRequested = true;
            }

            // Bind to document body to catch the first tap/click anywhere to initialize gyro
            document.body.addEventListener('click', initDeviceOrientation, { once: true });
            document.body.addEventListener('touchstart', initDeviceOrientation, { once: true });


            // --- Core App Logic ---

            function formatNumber(num) {
                if (num >= 1000000) return (num / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
                if (num >= 1000) return (num / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
                return num.toString();
            }

            pasteBtn.addEventListener('click', async () => {
                try {
                    const text = await navigator.clipboard.readText();
                    usernameInput.value = text;
                } catch (err) {
                    console.log('Clipboard access denied');
                    pasteBtn.classList.add('text-red-500');
                    setTimeout(() => pasteBtn.classList.remove('text-red-500'), 500);
                }
            });

            function startGame() {
                const val = usernameInput.value.trim();
                const rawUsername = val || "guest_creator";
                username = rawUsername.startsWith('@') ? rawUsername : '@' + rawUsername;
                
                // Update new display elements
                const nameWithoutAt = username.substring(1);
                if(displayName) displayName.textContent = nameWithoutAt;
                if(displayUsername) displayUsername.textContent = username;

                loginScreen.classList.remove('active');
                
                // Reset states
                followers = 0;
                clickCount = 0;
                clickPower = 1;
                followersCountEl.textContent = "0";
                followersCountEl.style.color = '';

                setTimeout(() => {
                    gameScreen.classList.add('active');
                    resizeCanvas();
                }, 100); // Slight delay for smoother feel
            }

            startBtn.addEventListener('click', startGame);
            usernameInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') startGame();
            });

            // --- Game Mechanics & Visuals ---

            function createFloatingNumber(x, y, value) {
                const el = document.createElement('div');
                const formattedValue = formatNumber(value);
                el.textContent = `+${formattedValue}`;
                el.className = 'absolute font-black text-2xl pointer-events-none select-none z-50';
                
                const isCyan = Math.random() > 0.5;
                el.style.color = isCyan ? '#00f2fe' : '#fe0979';
                
                const rect = mainClicker.getBoundingClientRect();
                const startX = (x ? x : rect.left + rect.width / 2) - 10;
                const startY = (y ? y : rect.top + rect.height / 2) - 10;
                
                el.style.left = `${startX}px`;
                el.style.top = `${startY}px`;
                
                document.body.appendChild(el);

                const duration = 800 + Math.random() * 400;
                const randomX = (Math.random() - 0.5) * 60;
                const randomY = -80 - Math.random() * 60;

                const animation = el.animate([
                    { transform: 'translate(0, 0) scale(0.8)', opacity: 0 },
                    { transform: `translate(${randomX * 0.2}px, ${randomY * 0.2}px) scale(1.2)`, opacity: 1, offset: 0.2 },
                    { transform: `translate(${randomX}px, ${randomY}px) scale(0.9)`, opacity: 0 }
                ], {
                    duration: duration,
                    easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)'
                });

                animation.onfinish = () => el.remove();
            }

            function handleMainClick(e) {
                if(e.type === 'touchstart') e.preventDefault(); // Prevent double firing

                let clientX, clientY;
                if (e.type === 'touchstart') {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }

                // Increment click count and calculate exponential power (capping at 500k)
                // INCREASED PROGRESSION: Changed base from 1.14 to 1.35 for much faster growth
                clickCount++;
                clickPower = Math.min(500000, Math.ceil(Math.pow(1.35, clickCount)));

                // ONLY increase followers
                followers += clickPower;

                const formattedFollowers = formatNumber(followers);
                
                if (followersCountEl.textContent !== formattedFollowers) {
                    followersCountEl.textContent = formattedFollowers;
                }

                // Smooth, cinematic combo bounce and highlight
                followersCountEl.classList.add('combo-active');
                
                // Force reflow to re-trigger the bounce animation on every single click
                followersCountEl.classList.remove('animate-pop');
                void followersCountEl.offsetWidth; 
                followersCountEl.classList.add('animate-pop');

                clearTimeout(counterTimeout);
                counterTimeout = setTimeout(() => {
                    followersCountEl.classList.remove('combo-active');
                }, 350); // Wait a bit before losing the combo glow

                createFloatingNumber(clientX, clientY, clickPower);
                spawnParticles(clientX, clientY);
                
                if (navigator.vibrate) navigator.vibrate(40);
            }

            mainClicker.addEventListener('mousedown', handleMainClick);
            mainClicker.addEventListener('touchstart', handleMainClick, {passive: false});

            // --- Particles System ---

            function resizeCanvas() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
            }

            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            class Particle {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 5 + 2; // Softer explosion
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    
                    this.size = Math.random() * 4 + 2;
                    this.life = 1;
                    this.decay = Math.random() * 0.03 + 0.02;
                    
                    const colors = [
                        {r: 0, g: 242, b: 254},
                        {r: 254, g: 9, b: 121}
                    ];
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                }

                update() {
                    this.vy += 0.15; // Soft gravity
                    this.x += this.vx;
                    this.y += this.vy;
                    this.life -= this.decay;
                    this.vx *= 0.95; // Friction
                    this.vy *= 0.95;
                }

                draw(ctx) {
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, this.life);
                    ctx.fillStyle = `rgb(${this.color.r}, ${this.color.g}, ${this.color.b})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            function spawnParticles(x, y) {
                const spawnX = x || width / 2;
                const spawnY = y || height / 2;
                const count = Math.floor(Math.random() * 6) + 4; // Fewer, subtler particles
                for (let i = 0; i < count; i++) {
                    particles.push(new Particle(spawnX, spawnY));
                }
            }

            function animateParticles() {
                ctx.clearRect(0, 0, width, height);
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.update();
                    if (p.life <= 0) {
                        particles.splice(i, 1);
                    } else {
                        p.draw(ctx);
                    }
                }
                requestAnimationFrame(animateParticles);
            }
            animateParticles();
            
            // Prevent double tap zoom on iOS
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function (e) {
                let now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) {
                    e.preventDefault();
                }
                lastTouchEnd = now;
            }, false);
        });
    </script>
</body>
</html>
